<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonoma Raceway 3D</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bg: #f2efe8; --fg: #1d1d1b; --muted: #6b675e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ecebe6; --muted: #9a968c; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  header { position: fixed; top: 16px; left: 16px; right: 16px; pointer-events: none; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Sonoma Raceway</h1>
  <p>Generated with Mint Modeler from OpenStreetMap layout and real elevation data. Drag to orbit, scroll to zoom.</p>
</header>
<model-viewer src="sonoma-raceway.glb" alt="3D model of Sonoma Raceway" camera-controls touch-action="pan-y"
  environment-image="neutral" shadow-intensity="1" exposure="1.05" tone-mapping="aces"
  camera-orbit="35deg 55deg auto" min-camera-orbit="auto auto 15m" max-camera-orbit="auto 88deg auto" auto-rotate auto-rotate-delay="4000" rotation-per-second="6deg"></model-viewer>
</body>
</html>
